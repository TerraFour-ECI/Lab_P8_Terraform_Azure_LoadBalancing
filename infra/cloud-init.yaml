#cloud-config
# =============================================================================
#  Cloud-init bootstrap for Lab #8 backend VMs
# -----------------------------------------------------------------------------
#  Runs once on first boot. Installs nginx and writes an index page that
#  embeds the VM's hostname, so the Load Balancer round-robin behaviour is
#  observable end-to-end with a simple `curl http://<lb_public_ip>`.
# =============================================================================
package_update: true
packages:
  - nginx
runcmd:
  - echo "<h1>Hello from $(hostname)</h1>" > /var/www/html/index.nginx-debian.html
  - systemctl enable nginx
  - systemctl restart nginx
